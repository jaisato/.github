# Mantiene al día los SHAs de las acciones ancladas en .github/workflows/*.yml
# (Dependabot actualiza el SHA y el comentario con la versión a la vez).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
