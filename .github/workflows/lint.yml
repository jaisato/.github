# Valida los workflows de este repositorio con actionlint (+ shellcheck).
name: Lint de workflows

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # shellcheck viene preinstalado en ubuntu-latest; actionlint lo usa para
      # revisar los scripts de cada `run:`.
      - name: actionlint
        run: pipx run --spec 'actionlint-py==1.7.12.25' actionlint -no-color .github/workflows/*.yml
