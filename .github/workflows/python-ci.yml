# Workflow reutilizable de CI para proyectos Python: ruff, mypy, pytest (con
# cobertura mínima opcional), pip-audit y build de validación de la imagen Docker.
#
# Lo invoca cada repositorio con:
#   jobs:
#     ci:
#       uses: jaisato/.github/.github/workflows/python-ci.yml@main
#       with: { ... }
#
# Reglas de la casa:
#   - Las entradas llegan a los scripts por `env`, nunca interpoladas con `${{ }}`
#     dentro de `run:`: la interpolación ocurre antes de que el shell vea el texto.
#   - Toda acción de terceros va anclada a un SHA (con la versión al lado, para
#     que Dependabot la actualice). Una etiqueta se puede reescribir; un SHA no.
name: Python CI (reutilizable)

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'Lista JSON de versiones de Python para la matriz de tests (p. ej. ["3.11", "3.12"]).'
        type: string
        default: '["3.12"]'
      tools-python-version:
        description: "Versión de Python para lint, tipos y auditoría. Por defecto, la primera de python-versions."
        type: string
        default: ""
      working-directory:
        description: "Directorio del proyecto Python (donde están pyproject.toml o los requirements)."
        type: string
        default: "."
      install-command:
        description: >-
          Comando de instalación de dependencias. Si se deja el valor por defecto y no hay
          pyproject.toml, se usan requirements-dev.lock, requirements-dev.txt o requirements.txt.
        type: string
        default: 'pip install -e ".[dev]"'
      cache-dependency-path:
        description: "Globs (uno por línea) cuyos ficheros forman la clave de la caché de pip."
        type: string
        default: |
          **/pyproject.toml
          **/requirements*.txt
          **/requirements*.lock
      ruff-paths:
        description: "Rutas (separadas por espacios) que analiza ruff."
        type: string
        default: "."
      ruff-format:
        description: "Ejecutar también `ruff format --check`."
        type: boolean
        default: true
      run-mypy:
        description: "Ejecutar mypy."
        type: boolean
        default: false
      mypy-paths:
        description: "Rutas para mypy. Vacío: las que fije la configuración del proyecto (o `.` si no hay)."
        type: string
        default: ""
      coverage-min:
        description: "Cobertura mínima de líneas (0 desactiva la medición)."
        type: number
        default: 0
      coverage-source:
        description: "Paquete o ruta para `--cov=`. Vacío: `--cov` con la configuración del proyecto."
        type: string
        default: ""
      extra-test-args:
        description: "Argumentos extra para pytest."
        type: string
        default: ""
      run-pip-audit:
        description: "Ejecutar pip-audit."
        type: boolean
        default: false
      pip-audit-args:
        description: "Argumentos de pip-audit (p. ej. `-r requirements.lock`). Vacío: audita el entorno instalado."
        type: string
        default: ""
      pip-audit-ignore-file:
        description: >-
          Fichero del repositorio (ruta relativa a working-directory) con los avisos triados: un
          aviso por línea con sus identificadores (GHSA-…, CVE-…, PYSEC-…) separados por espacios,
          y «#» abre un comentario. Si se indica, se instala el entorno aunque haya pip-audit-args,
          pip-audit emite JSON y solo fallan los avisos que no estén en el fichero; un triado que
          ya no aparece sale como aviso. Vacío: pip-audit tal cual.
        type: string
        default: ""
      pip-audit-strict:
        description: "Si es true, una vulnerabilidad hace fallar el job; si no, solo se avisa."
        type: boolean
        default: false
      docker-build:
        description: "Construir la imagen Docker sin publicarla, como validación."
        type: boolean
        default: false
      docker-context:
        description: "Contexto del build de Docker. Vacío: working-directory."
        type: string
        default: ""
      dockerfile:
        description: "Ruta del Dockerfile. Vacío: el Dockerfile del contexto."
        type: string
        default: ""

permissions: {}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.tools-python-version || fromJSON(inputs.python-versions)[0] }}
          cache: pip
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Instalar dependencias
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ ! -f pyproject.toml ] && [ "$INSTALL_COMMAND" = 'pip install -e ".[dev]"' ]; then
            if [ -f requirements-dev.lock ]; then pip install -r requirements-dev.lock
            elif [ -f requirements-dev.txt ]; then
              pip install -r requirements-dev.txt
              if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            elif [ -f requirements.txt ]; then pip install -r requirements.txt
            else
              echo "::error::No hay pyproject.toml ni ficheros requirements; indica install-command"
              exit 1
            fi
          else
            bash -euo pipefail -c "$INSTALL_COMMAND"
          fi
          command -v ruff >/dev/null || pip install ruff

      - name: ruff check
        env:
          RUFF_PATHS: ${{ inputs.ruff-paths }}
        run: |
          read -ra paths <<< "$RUFF_PATHS"
          ruff check "${paths[@]}"

      - name: ruff format --check
        if: inputs.ruff-format
        env:
          RUFF_PATHS: ${{ inputs.ruff-paths }}
        run: |
          read -ra paths <<< "$RUFF_PATHS"
          ruff format --check "${paths[@]}"

  types:
    name: Tipos (mypy)
    if: inputs.run-mypy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.tools-python-version || fromJSON(inputs.python-versions)[0] }}
          cache: pip
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Instalar dependencias
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ ! -f pyproject.toml ] && [ "$INSTALL_COMMAND" = 'pip install -e ".[dev]"' ]; then
            if [ -f requirements-dev.lock ]; then pip install -r requirements-dev.lock
            elif [ -f requirements-dev.txt ]; then
              pip install -r requirements-dev.txt
              if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            elif [ -f requirements.txt ]; then pip install -r requirements.txt
            else
              echo "::error::No hay pyproject.toml ni ficheros requirements; indica install-command"
              exit 1
            fi
          else
            bash -euo pipefail -c "$INSTALL_COMMAND"
          fi
          command -v mypy >/dev/null || pip install mypy

      - name: mypy
        env:
          MYPY_PATHS: ${{ inputs.mypy-paths }}
        run: |
          read -ra paths <<< "$MYPY_PATHS"
          if [ "${#paths[@]}" -gt 0 ]; then
            mypy "${paths[@]}"
          elif grep -qsE '^\s*files\s*=' pyproject.toml mypy.ini setup.cfg 2>/dev/null; then
            mypy
          else
            mypy .
          fi

  tests:
    name: Tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Instalar dependencias
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          WITH_COVERAGE: ${{ inputs.coverage-min > 0 }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ ! -f pyproject.toml ] && [ "$INSTALL_COMMAND" = 'pip install -e ".[dev]"' ]; then
            if [ -f requirements-dev.lock ]; then pip install -r requirements-dev.lock
            elif [ -f requirements-dev.txt ]; then
              pip install -r requirements-dev.txt
              if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            elif [ -f requirements.txt ]; then pip install -r requirements.txt
            else
              echo "::error::No hay pyproject.toml ni ficheros requirements; indica install-command"
              exit 1
            fi
          else
            bash -euo pipefail -c "$INSTALL_COMMAND"
          fi
          python -c 'import pytest' 2>/dev/null || pip install pytest
          if [ "$WITH_COVERAGE" = "true" ]; then
            python -c 'import pytest_cov' 2>/dev/null || pip install pytest-cov
          fi

      - name: pytest
        env:
          WITH_COVERAGE: ${{ inputs.coverage-min > 0 }}
          COVERAGE_MIN: ${{ inputs.coverage-min }}
          COVERAGE_SOURCE: ${{ inputs.coverage-source }}
          EXTRA_TEST_ARGS: ${{ inputs.extra-test-args }}
        run: |
          args=()
          if [ "$WITH_COVERAGE" = "true" ]; then
            args+=("--cov${COVERAGE_SOURCE:+=$COVERAGE_SOURCE}" --cov-report=term-missing --cov-report=xml "--cov-fail-under=$COVERAGE_MIN")
          fi
          read -ra extra <<< "$EXTRA_TEST_ARGS"
          pytest "${args[@]}" "${extra[@]}"

      - name: Publicar informe de cobertura
        if: always() && inputs.coverage-min > 0
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: Auditoría de dependencias (pip-audit)
    if: inputs.run-pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.tools-python-version || fromJSON(inputs.python-versions)[0] }}
          cache: pip
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      # Con pip-audit-ignore-file se audita el entorno instalado aunque haya
      # pip-audit-args (que entonces son argumentos extra, como --skip-editable).
      - name: Instalar dependencias (solo si se audita el entorno)
        if: inputs.pip-audit-args == '' || inputs.pip-audit-ignore-file != ''
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ ! -f pyproject.toml ] && [ "$INSTALL_COMMAND" = 'pip install -e ".[dev]"' ]; then
            if [ -f requirements-dev.lock ]; then pip install -r requirements-dev.lock
            elif [ -f requirements-dev.txt ]; then
              pip install -r requirements-dev.txt
              if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            elif [ -f requirements.txt ]; then pip install -r requirements.txt
            else
              echo "::error::No hay pyproject.toml ni ficheros requirements; indica install-command"
              exit 1
            fi
          else
            bash -euo pipefail -c "$INSTALL_COMMAND"
          fi

      # Con pip-audit-strict=false una CVE sin parche aguas arriba no bloquea el
      # resto del CI, pero queda visible como aviso en el job.
      - name: pip-audit
        if: inputs.pip-audit-ignore-file == ''
        continue-on-error: ${{ !inputs.pip-audit-strict }}
        env:
          PIP_AUDIT_ARGS: ${{ inputs.pip-audit-args }}
        run: |
          pip install pip-audit
          read -ra extra <<< "$PIP_AUDIT_ARGS"
          pip-audit --progress-spinner off "${extra[@]}"

      # Con pip-audit-ignore-file, el mismo pip-audit con el informe en JSON y
      # los avisos triados aparte. Cada línea con contenido del fichero es un
      # aviso: sus identificadores (el que da pip-audit y sus alias: GHSA, CVE,
      # PYSEC) separados por espacios, y «#» abre un comentario. Un aviso cuenta
      # como triado si cualquiera de sus identificadores o alias está en el
      # fichero (pip-audit puede dar el CVE donde el fichero tiene el GHSA, o al
      # revés); nada se pasa como --ignore-vuln. Los no triados salen como
      # ::error:: con la versión que los corrige y ponen el paso en rojo; una
      # línea cuyos identificadores ya no aparecen (la versión instalada los
      # corrige) sale como ::warning:: sobre esa línea, para quitarla. Si
      # pip-audit no llega a escribir el informe (sin red, servicio caído), el
      # paso falla con su código. pip-audit-strict decide, como arriba, si el
      # rojo del paso se propaga al job.
      - name: pip-audit (avisos triados aparte)
        if: inputs.pip-audit-ignore-file != ''
        continue-on-error: ${{ !inputs.pip-audit-strict }}
        env:
          PIP_AUDIT_ARGS: ${{ inputs.pip-audit-args }}
          PIP_AUDIT_IGNORE_FILE: ${{ inputs.pip-audit-ignore-file }}
        run: |
          set -euo pipefail
          pip install pip-audit
          read -ra extra <<< "$PIP_AUDIT_ARGS"
          informe="$RUNNER_TEMP/pip-audit.json"
          rc=0
          pip-audit --progress-spinner off -f json -o "$informe" "${extra[@]}" || rc=$?
          if [ ! -s "$informe" ]; then
            echo "::error::pip-audit ha terminado con código $rc sin escribir el informe"
            exit "$(( rc == 0 ? 1 : rc ))"
          fi
          python - "$informe" "$PIP_AUDIT_IGNORE_FILE" <<'PY'
          import json, os, sys

          informe, lista = sys.argv[1], sys.argv[2]


          def anota(tipo, mensaje, **params):
              # Comandos de workflow: %, CR y LF se escapan en el mensaje; en los
              # parámetros (file, line), también «:» y «,».
              def esc(texto, extra=""):
                  texto = str(texto).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  for c in extra:
                      texto = texto.replace(c, "%%%02X" % ord(c))
                  return texto

              cabecera = ",".join(f"{k}={esc(v, ':,')}" for k, v in params.items())
              print(f"::{tipo}{' ' + cabecera if cabecera else ''}::{esc(mensaje)}")


          try:
              with open(lista, encoding="utf-8-sig") as f:
                  lineas = f.read().splitlines()
          except OSError as e:
              anota("error", f"pip-audit: no se puede leer la lista de avisos triados ({lista}): {e.strerror}")
              sys.exit(1)

          # Una entrada por línea con contenido: sus identificadores tal cual y, para
          # comparar, en mayúsculas.
          triados = []
          for n, linea in enumerate(lineas, 1):
              ids = linea.split("#", 1)[0].split()
              if ids:
                  triados.append({"linea": n, "ids": ids, "clave": {i.upper() for i in ids}, "vistos": 0})

          with open(informe, encoding="utf-8") as f:
              datos = json.load(f)

          con_triaje, sin_triar, omitidos = [], [], []
          for dep in datos.get("dependencies") or []:
              # Las dependencias omitidas no llevan versión (va dentro del motivo).
              nombre, version = dep.get("name", "?"), dep.get("version")
              paquete = f"{nombre} {version}" if version else nombre
              if dep.get("skip_reason"):
                  omitidos.append(f"{paquete}: {dep['skip_reason']}")
              for v in dep.get("vulns") or []:
                  ids = [i for i in [v.get("id")] + list(v.get("aliases") or []) if i]
                  clave = {i.upper() for i in ids}
                  corregido = ", ".join(v.get("fix_versions") or [])
                  texto = f"{paquete}: {' / '.join(ids)}, " + (f"corregido en {corregido}" if corregido else "sin versión corregida")
                  entradas = [t for t in triados if t["clave"] & clave]
                  for t in entradas:
                      t["vistos"] += 1
                  if entradas:
                      con_triaje.append(f"{texto} (línea {', '.join(str(t['linea']) for t in entradas)})")
                  else:
                      descripcion = (v.get("description") or "").strip().splitlines() or [""]
                      sin_triar.append((texto, descripcion[0][:160]))

          for texto in con_triaje:
              print(f"triado    {texto}")
          for texto in omitidos:
              print(f"omitido   {texto}")
          for texto, descripcion in sin_triar:
              print(f"SIN TRIAR {texto}")
              if descripcion:
                  print(f"          {descripcion}")
              anota("error", f"pip-audit: {texto}. Sin triar en {lista}")
          raiz = os.environ.get("GITHUB_WORKSPACE") or os.getcwd()
          for t in triados:
              if not t["vistos"]:
                  anota("warning", f"pip-audit: {' '.join(t['ids'])} ya no aparece: quítalo de {lista} (línea {t['linea']})",
                        file=os.path.relpath(os.path.abspath(lista), raiz), line=t["linea"])
          total = len(con_triaje) + len(sin_triar)
          print(f"pip-audit: {total} avisos; {len(con_triaje)} triados aparte ({lista}), {len(sin_triar)} sin triar")
          sys.exit(1 if sin_triar else 0)
          PY

  docker:
    name: Build de validación de la imagen (sin push)
    if: inputs.docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker-context || inputs.working-directory }}
          file: ${{ inputs.dockerfile }}
          push: false
          tags: ci-validation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
